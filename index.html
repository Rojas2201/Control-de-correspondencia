<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Control de Correspondencia</title>

<style>

/* TODO EL DISEÑO VA AQUÍ */
    body{
font-family:Inter,sans-serif;
background:#f1f5f9;
margin:0;
}

.topbar{
height:70px;
background:#0f172a;
color:white;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 20px;
}

.main{
display:flex;
}

.sidebar{
width:280px;
background:white;
padding:20px;
border-right:1px solid #ddd;
min-height:100vh;
}

.content{
flex:1;
padding:20px;
}

.card{
border:none;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

</style>

</head>

<body>

<!-- BARRA SUPERIOR -->
<div class="topbar">

    <div>
        <strong>ENEE</strong><br>
        Control de Correspondencia
    </div>

    <div>
        Administrador
    </div>

</div>
<!-- PANEL IZQUIERDO -->
<div class="main">

<div class="sidebar">

<h5>Resumen</h5>

<div class="card p-3 mb-3">
    Total: <span id="total">0</span>
</div>

<div class="card p-3 mb-3">
    Entradas: <span id="entradas">0</span>
</div>

<div class="card p-3 mb-3">
    Salidas: <span id="salidas">0</span>
</div>

<div class="card p-3">
    Pendientes: <span id="pendientes">0</span>
</div>

</div>

<div class="content">

<div class="card p-4 mb-4">

<h4>Nueva Correspondencia</h4>
<!-- FORMULARIO -->
<div class="row">

<div class="col-md-3">
<label>Número</label>
<input id="numero"
class="form-control"
readonly>
</div>

<div class="col-md-3">
<label>Fecha Registro</label>
<input type="date"
id="fechaRegistro"
class="form-control">
</div>

<div class="col-md-3">
<label>Tipo</label>

<select id="tipo"
class="form-select">

<option>Entrada</option>
<option>Salida</option>

</select>

</div>

<div class="col-md-3">
<label>Estado</label>

<select id="estado"
class="form-select">

<option>Pendiente</option>
<option>En Proceso</option>
<option>Finalizado</option>

</select>

</div>

</div>

<br>

<input
id="remitente"
placeholder="Remitente"
class="form-control mb-3">

<input
id="destinatario"
placeholder="Destinatario"
class="form-control mb-3">

<input
id="asunto"
placeholder="Asunto"
class="form-control mb-3">

<button
onclick="guardarRegistro()"
class="btn btn-primary">

Guardar

</button>
<!-- TABLA -->
</div>

<div class="card p-4">

<h4>Correspondencia Registrada</h4>

<table
class="table table-striped">

<thead>

<tr>
<th>Número</th>
<th>Fecha</th>
<th>Tipo</th>
<th>Remitente</th>
<th>Estado</th>
</tr>

</thead>

<tbody id="tabla">

</tbody>

</table>

</div>

</div
<!-- JAVASCRIPT -->
    <script>

let registros =
JSON.parse(
localStorage.getItem("correspondencia")
) || [];

function generarNumero(){

let numero =
registros.length + 1;

let anio =
new Date().getFullYear();

return `COR-${anio}-${String(numero).padStart(5,'0')}`;

}

function actualizarNumero(){

document.getElementById("numero").value =
generarNumero();

}

function guardarRegistro(){

let registro = {

numero:
document.getElementById("numero").value,

fecha:
document.getElementById("fechaRegistro").value,

tipo:
document.getElementById("tipo").value,

estado:
document.getElementById("estado").value,



</body>

</html>
