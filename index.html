<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Control de Correspondencia</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
    --primary:#0f172a;
    --secondary:#1e293b;
    --accent:#2563eb;
    --background:#f1f5f9;
    --white:#ffffff;
}

body{
    margin:0;
    font-family:'Inter',sans-serif;
    background:var(--background);
}

/* BARRA SUPERIOR */

.topbar{
    height:70px;
    background:var(--primary);
    color:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 25px;
}

.logo{
    font-size:22px;
    font-weight:700;
}

.logo small{
    display:block;
    font-size:12px;
    font-weight:300;
}

/* LAYOUT */

.main{
    display:flex;
}

.sidebar{
    width:300px;
    background:white;
    border-right:1px solid #ddd;
    min-height:calc(100vh - 70px);
    padding:20px;
}

.content{
    flex:1;
    padding:20px;
}

.card-system{
    background:white;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.card-stat{
    text-align:center;
    padding:15px;
    background:#f8fafc;
    border-radius:10px;
    margin-bottom:10px;
}

.card-stat h2{
    margin:0;
    color:var(--primary);
}

.card-stat small{
    color:#64748b;
}

.table thead th{
    background:var(--primary);
    color:white;
}

.btn-primary{
    background:var(--accent);
    border:none;
}

.form-label{
    font-size:12px;
    text-transform:uppercase;
    font-weight:600;
}

/* RESPONSIVE */

@media(max-width:992px){

    .main{
        flex-direction:column;
    }

    .sidebar{
        width:100%;
        min-height:auto;
    }

}

</style>
</head>

<body>

<!-- BARRA SUPERIOR -->

<div class="topbar">

    <div class="logo">
        ENEE
        <small>Sistema de Control de Correspondencia</small>
    </div>

    <div>
        Usuario Administrador
    </div>

</div>

<div class="main">

    <!-- PANEL IZQUIERDO -->

    <div class="sidebar">

        <div class="card-system">

            <h5>Resumen General</h5>

            <div class="card-stat">
                <h2 id="totalDocs">0</h2>
                <small>Total</small>
            </div>

            <div class="card-stat">
                <h2 id="entradas">0</h2>
                <small>Entradas</small>
            </div>

            <div class="card-stat">
                <h2 id="salidas">0</h2>
                <small>Salidas</small>
            </div>

            <div class="card-stat">
                <h2 id="pendientes">0</h2>
                <small>Pendientes</small>
            </div>

        </div>

        <div class="card-system">

            <h6>Buscar</h6>

            <input
            id="buscar"
            class="form-control"
            placeholder="Número o remitente">

        </div>

        <div class="card-system">

            <h6>Reportes</h6>

            <button
            class="btn btn-primary w-100 mb-2"
            onclick="reporteDiario()">
                Reporte Diario
            </button>

            <button
            class="btn btn-success w-100"
            onclick="reporteMensual()">
                Reporte Mensual
            </button>

        </div>

    </div>

    <!-- CONTENIDO -->

    <div class="content">

        <div class="card-system">

            <h4>Registro de Correspondencia</h4>

            <div class="row">

                <div class="col-md-3 mb-3">
                    <label class="form-label">Número</label>
                    <input id="numero" class="form-control" readonly>
                </div>

                <div class="col-md-3 mb-3">
                    <label class="form-label">Fecha Registro</label>
                    <input id="fechaRegistro" type="date" class="form-control">
                </div>

                <div class="col-md-3 mb-3">
                    <label class="form-label">Fecha Documento</label>
                    <input id="fechaDocumento" type="date" class="form-control">
                </div>

                <div class="col-md-3 mb-3">
                    <label class="form-label">Tipo</label>
                    <select id="tipo" class="form-select">
                        <option>Entrada</option>
                        <option>Salida</option>
                    </select>
                </div>

            </div>

            <div class="row">

                <div class="col-md-4 mb-3">
                    <label class="form-label">Número Oficio</label>
                    <input id="oficio" class="form-control">
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">Remitente</label>
                    <input id="remitente" class="form-control">
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">Destinatario</label>
                    <input id="destinatario" class="form-control">
                </div>

            </div>

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label class="form-label">Asunto</label>
                    <input id="asunto" class="form-control">
                </div>

                <div class="col-md-3 mb-3">
                    <label class="form-label">Dependencia</label>
                    <input id="dependencia" class="form-control">
                </div>

                <div class="col-md-3 mb-3">
                    <label class="form-label">Estado</label>
                    <select id="estado" class="form-select">
                        <option>Pendiente</option>
                        <option>En Proceso</option>
                        <option>Finalizado</option>
                    </select>
                </div>

            </div>

            <div class="mb-3">

                <label class="form-label">Observaciones</label>

                <textarea
                id="observaciones"
                rows="3"
                class="form-control"></textarea>

            </div>

            <button
            class="btn btn-primary"
            onclick="guardarRegistro()">

                Guardar Registro

            </button>

        </div>

        <div class="card-system">

            <div class="d-flex justify-content-between mb-3">

                <h4>Correspondencia Registrada</h4>

                <input
                id="filtroFecha"
                type="date"
                class="form-control"
                style="width:220px">

            </div>

            <table class="table table-bordered">

                <thead>

                    <tr>
                        <th>Número</th>
                        <th>Fecha</th>
                        <th>Tipo</th>
                        <th>Oficio</th>
                        <th>Remitente</th>
                        <th>Estado</th>
                        <th>Acción</th>
                    </tr>

                </thead>

                <tbody id="tabla"></tbody>

            </table>

        </div>

    </div>

</div>

<script>

let registros =
JSON.parse(localStorage.getItem("correspondencia")) || [];

/* GENERAR CORRELATIVO */

function generarNumero(){

    const anio = new Date().getFullYear();

    const correlativo =
    String(registros.length + 1)
    .padStart(5,'0');

    return `COR-${anio}-${correlativo}`;
}

function actualizarNumero(){

    document.getElementById("numero").value =
    generarNumero();
}

/* GUARDAR */

function guardarRegistro(){

    const registro = {

        numero:
        document.getElementById("numero").value,

        fechaRegistro:
        document.getElementById("fechaRegistro").value,

        fechaDocumento:
        document.getElementById("fechaDocumento").value,

        tipo:
        document.getElementById("tipo").value,

        oficio:
        document.getElementById("oficio").value,

        remitente:
        document.getElementById("remitente").value,

        destinatario:
        document.getElementById("destinatario").value,

        asunto:
        document.getElementById("asunto").value,

        dependencia:
        document.getElementById("dependencia").value,

        estado:
        document.getElementById("estado").value,

        observaciones:
        document.getElementById("observaciones").value
    };

    registros.push(registro);

    localStorage.setItem(
        "correspondencia",
        JSON.stringify(registros)
    );

    cargarTabla();
    actualizarNumero();

    alert("Registro guardado");
}

function eliminarRegistro(numero){

    registros =
    registros.filter(r => r.numero !== numero);

    localStorage.setItem(
        "correspondencia",
        JSON.stringify(registros)
    );

    cargarTabla();
}

/* TABLA */

function cargarTabla(){

    const tabla =
    document.getElementById("tabla");

    tabla.innerHTML = "";

    registros.forEach(r => {

        tabla.innerHTML += `
        <tr>
            <td>${r.numero}</td>
            <td>${r.fechaRegistro}</td>
            <td>${r.tipo}</td>
            <td>${r.oficio}</td>
            <td>${r.remitente}</td>
            <td>${r.estado}</td>
            <td>
                <button
                class="btn btn-danger btn-sm"
                onclick="eliminarRegistro('${r.numero}')">
                Eliminar
                </button>
            </td>
        </tr>
        `;
    });

    actualizarEstadisticas();
}

/* ESTADISTICAS */

function actualizarEstadisticas(){

    document.getElementById("totalDocs").innerText =
    registros.length;

    document.getElementById("entradas").innerText =
    registros.filter(r=>r.tipo==="Entrada").length;

    document.getElementById("salidas").innerText =
    registros.filter(r=>r.tipo==="Salida").length;

    document.getElementById("pendientes").innerText =
    registros.filter(r=>r.estado==="Pendiente").length;
}

/* REPORTE DIARIO */

function reporteDiario(){

    const hoy =
    new Date().toISOString().split('T')[0];

    const docs =
    registros.filter(r => r.fechaRegistro === hoy);

    alert(
    `REPORTE DIARIO\n\nFecha: ${hoy}\nTotal: ${docs.length}`
    );
}

/* REPORTE MENSUAL */

function reporteMensual(){

    const mes =
    new Date().toISOString().slice(0,7);

    const docs =
    registros.filter(
    r => r.fechaRegistro.startsWith(mes)
    );

    alert(
    `REPORTE MENSUAL\n\nMes: ${mes}\nTotal: ${docs.length}`
    );
}

/* BUSCADOR */

document
.getElementById("buscar")
.addEventListener("keyup", function(){

    const filtro =
    this.value.toLowerCase();
