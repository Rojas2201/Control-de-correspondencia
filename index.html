<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sistema de Control de Correspondencia</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesomell.min.css

<script/cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.jsscript>

<style>

/* =====================================================
   VARIABLES INSTITUCIONALES
===================================================== */

:root{
    --azul:#0A3D62;
    --azul2:#1E5F92;
    --gris:#f4f6f9;
    --blanco:#ffffff;
    --verde:#27ae60;
    --rojo:#e74c3c;
}

/* =====================================================
   GENERALES
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,Tahoma,sans-serif;
}

body{
    background:var(--gris);
}

/* =====================================================
   LOGIN
===================================================== */

#loginScreen{
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,var(--azul),var(--azul2));
}

.login-card{
    background:white;
    width:350px;
    padding:35px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
}

.login-card h2{
    text-align:center;
    margin-bottom:20px;
}

.login-card input{
    width:100%;
    padding:12px;
    margin:8px 0;
}

.login-card button{
    width:100%;
    padding:12px;
    background:var(--azul);
    color:white;
    border:none;
    cursor:pointer;
}

/* =====================================================
   SISTEMA
===================================================== */

#app{
    display:none;
}

.sidebar{
    width:250px;
    background:var(--azul);
    height:100vh;
    position:fixed;
    color:white;
}

.logo{
    text-align:center;
    padding:25px;
    border-bottom:1px solid rgba(255,255,255,.2);
}

.sidebar ul{
    list-style:none;
}

.sidebar ul li{
    padding:15px 20px;
    cursor:pointer;
}

.sidebar ul li:hover{
    background:rgba(255,255,255,.15);
}

.main{
    margin-left:250px;
    padding:25px;
}

.section{
    display:none;
}

.section.active{
    display:block;
}

.card{
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
    margin-bottom:20px;
}

.card h2{
    margin-bottom:15px;
    color:var(--azul);
}

.grid{
    display:grid;
    gap:15px;
}

.grid-2{
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
}

input,select,textarea{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:8px;
}

textarea{
    resize:vertical;
}

.btn{
    background:var(--azul);
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
}

.btn-danger{
    background:var(--rojo);
}

.btn-success{
    background:var(--verde);
}

/* =====================================================
   TABLAS
===================================================== */

table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
}

th{
    background:var(--azul);
    color:white;
}

th,td{
    padding:10px;
    border:1px solid #ddd;
    text-align:left;
}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
}

.stat{
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.stat h3{
    font-size:30px;
    color:var(--azul);
}

</style>
</head>
<body>

<!-- =====================================================
     LOGIN
===================================================== -->

<div id="loginScreen">

    <div class="login-card">
        <h2>Control de Correspondencia</h2>

        <input type="text" id="usuario" placeholder="Usuario">
        <input type="password" id="password" placeholder="Contraseña">

        <button onclick="login()">
            Ingresar
        </button>
    </div>

</div>

<!-- =====================================================
     SISTEMA PRINCIPAL
===================================================== -->

<div id="app">

    <div class="sidebar">

        <div class="logo">
            <h2>Correspondencia</h2>
        </div>

        <ul>
            <li onclick="mostrarSeccion('dashboard')">
                <i class="fas fa-chart-line"></i>
                Dashboard
            </li>

            <li onclick="mostrarSeccion('recepcion')">
                <i class="fas fa-file-import"></i>
                Recepción
            </li>

            <li onclick="mostrarSeccion('consultas')">
                <i class="fas fa-search"></i>
                Consultas
            </li>

            <li onclick="logout()">
                <i class="fas fa-sign-out-alt"></i>
                Salir
            </li>
        </ul>

    </div>

    <div class="main">

        <!-- DASHBOARD -->

        <section id="dashboard" class="section active">

            <div class="card">
                <h2>Dashboard</h2>

                <div class="stats">

                    <div class="stat">
                        <span>Documentos Hoy</span>
                        <h3 id="docHoy">0</h3>
                    </div>

                    <div class="stat">
                        <span>Total Registros</span>
                        <h3 id="totalDocs">0</h3>
                    </div>

                </div>

            </div>

        </section>

        <!-- RECEPCION -->

        <section id="recepcion" class="section">

            <div class="card">

                <h2>Recepción de Correspondencia</h2>

                <div class="grid grid-2">

                    <div>
                        <label>Departamento que Remite</label>
                        <input id="departamento">
                    </div>

                    <div>
                        <label>Tipo Documento</label>
                        <select id="tipo">
                            <option>Oficio</option>
                            <option>Memorándum</option>
                            <option>Circular</option>
                            <option>Informe</option>
                        </select>
                    </div>

                    <div>
                        <label>No. Documento</label>
                        <input id="numero">
                    </div>

                    <div>
                        <label>Fecha Recepción</label>
                        <input type="date" id="fechaRecepcion">
                    </div>

                    <div>
                        <label>Fecha Emisión</label>
                        <input type="date" id="fechaEmision">
                    </div>

                </div>

                <br>

                <label>Asunto</label>
                <textarea id="asunto"></textarea>

                <br><br>

                <label>Observaciones</label>
                <textarea id="observaciones"></textarea>

                <br><br>

                <button class="btn btn-success" onclick="guardarRegistro()">
                    Guardar Documento
                </button>

            </div>

        </section>

        <!-- CONSULTAS -->

        <section id="consultas" class="section">

            <div class="card">

                <h2>Consulta de Correspondencia</h2>

                <div class="grid grid-2">

                    <div>
                        <label>Fecha Inicio</label>
                        <input type="date" id="fInicio">
                    </div>

                    <div>
                        <label>Fecha Fin</label>
                        <input type="date" id="fFin">
                    </div>

                </div>

                <br>

                <button class="btn" onclick="filtrar()">
                    Buscar
                </button>

                <button class="btn btn-success" onclick="generarPDF()">
                    PDF
                </button>

                <table>

                    <thead>
                        <tr>
                            <th>No.</th>
                            <th>Departamento</th>
                            <th>Documento</th>
                            <th>Recepción</th>
                            <th>Asunto</th>
                            <th>Acción</th>
                        </tr>
                    </thead>

                    <tbody id="tablaDatos"></tbody>

                </table>

            </div>

        </section>

    </div>

</div>

<script>

/* =====================================================
   LOGIN
===================================================== */

function login(){

    const user=document.getElementById("usuario").value;
    const pass=document.getElementById("password").value;

    if(user==="admin" && pass==="123456"){

        document.getElementById("loginScreen").style.display="none";
        document.getElementById("app").style.display="block";

        cargarTabla();
        actualizarDashboard();

    }else{
        alert("Credenciales incorrectas");
    }
}

function logout(){
    location.reload();
}

/* =====================================================
   NAVEGACION
===================================================== */

function mostrarSeccion(id){

    document.querySelectorAll(".section").forEach(sec=>{
        sec.classList.remove("active");
    });

    document.getElementById(id).classList.add("active");
}

/* =====================================================
   LOCAL STORAGE
===================================================== */

function obtenerDatos(){
    return JSON.parse(localStorage.getItem("documentos")) || [];
}

/* =====================================================
   GUARDAR
===================================================== */

function guardarRegistro(){

    let documentos=obtenerDatos();

    documentos.push({

        id:Date.now(),
        departamento:departamento.value,
        tipo:tipo.value,
        numero:numero.value,
        fechaRecepcion:fechaRecepcion.value,
        fechaEmision:fechaEmision.value,
        asunto:asunto.value,
        observaciones:observaciones.value

    });

    localStorage.setItem(
        "documentos",
        JSON.stringify(documentos)
    );

    alert("Documento guardado");

    document.querySelectorAll(
    "#recepcion input,#recepcion textarea")
    .forEach(x=>x.value="");

    cargarTabla();
    actualizarDashboard();
}

/* =====================================================
   TABLA
===================================================== */

function cargarTabla(datos=null){

    const registros=datos || obtenerDatos();

    let html="";

    registros.forEach(doc=>{

        html+=`
        <tr>
            <td>${doc.numero}</td>
            <td>${doc.departamento}</td>
            <td>${doc.tipo}</td>
            <td>${doc.fechaRecepcion}</td>
            <td>${doc.asunto}</td>
            <td>
                <button class="btn-danger btn"
                onclick="eliminar(${doc.id})">
                Eliminar
                </button>
            </td>
        </tr>
        `;
    });

    tablaDatos.innerHTML=html;
}

/* =====================================================
   ELIMINAR
===================================================== */

function eliminar(id){

    let documentos=obtenerDatos()
    .filter(x=>x.id!==id);

    localStorage.setItem(
    "documentos",
    JSON.stringify(documentos));

    cargarTabla();
    actualizarDashboard();
}

/* =====================================================
   FILTROS
===================================================== */

function filtrar(){

    let docs=obtenerDatos();

    let inicio=fInicio.value;
    let fin=fFin.value;

    if(inicio){
        docs=docs.filter(d=>
        d.fechaRecepcion>=inicio);
    }

    if(fin){
        docs=docs.filter(d=>
        d.fechaRecepcion<=fin);
    }

    cargarTabla(docs);
}

/* =====================================================
   DASHBOARD
===================================================== */

function actualizarDashboard(){

    let docs=obtenerDatos();

    totalDocs.innerText=docs.length;

    const hoy=new Date()
    .toISOString()
    .split("T")[0];

    let hoyDocs=docs.filter(
    x=>x.fechaRecepcion===hoy);

    docHoy.innerText=hoyDocs.length;
}

/* =====================================================
   PDF
===================================================== */

function generarPDF(){

    const {jsPDF}=window.jspdf;

    const pdf=new jsPDF();

    pdf.setFontSize(16);

    pdf.text(
    "Reporte de Correspondencia",
    20,
    20);

    let y=40;

    obtenerDatos().forEach(doc=>{

        pdf.text(
        `${doc.numero} | ${doc.departamento} | ${doc.fechaRecepcion}`,
        10,
        y
        );

        y+=10;

        if(y>270){
            pdf.addPage();
            y=20;
        }

    });

    pdf.save("Correspondencia.pdf");
}

/* =====================================================
   INICIALIZACION
===================================================== */

cargarTabla();
actualizarDashboard();

</script>

</body>
</html>
